name: Deploy web to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '187.127.54.55 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILG2+WXok2+/L5AohuAOkbLcdgQVB/mX7z/ouPdAhefL' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build, smoke-check and deploy web
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "deploy web $GITHUB_SHA"

      # A chave de deploy só aceita comandos da lista do forced command do servidor.
      # "migrate web <sha>" roda `prisma migrate deploy` a partir do checkout
      # /opt/hexavante/web (DATABASE_URL vem do container hexavante-app, sem segredo no GitHub).
      - name: Apply Prisma migrations (web)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "migrate web $GITHUB_SHA"
