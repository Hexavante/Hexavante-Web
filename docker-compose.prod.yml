services:
  mariadb:
    image: mariadb:11
    container_name: hexavante-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: hexavante
      MARIADB_USER: hexavante
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hexavante_data:/var/lib/mysql
    networks:
      - hexavante_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hexavante-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://hexavante:${DB_PASSWORD}@mariadb:3306/hexavante
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://hexavante.com.br}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.hexavante.com.br}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://127.0.0.1:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_GO_API_URL: ${NEXT_PUBLIC_GO_API_URL:-https://api.hexavante.com.br}
      # XP/moedas via API (/internal/v1/*). Mesmo valor da API; obrigatório.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina INTERNAL_API_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - hexavante_net

  api-go:
    build:
      # Cópia canônica em Webs/Hexavante-api-go (./api-go não existe no repo).
      context: ../../Hexavante-api-go
      dockerfile: Dockerfile
    container_name: hexavante-api-go
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: 3050
      DATABASE_URL: hexavante:${DB_PASSWORD}@tcp(mariadb:3306)/hexavante?parseTime=true
      FRONTEND_URL: ${AUTH_URL:-https://hexavante.com.br}
      NODE_ENV: production
      CORS_ORIGIN: "https://hexavante.com.br,https://www.hexavante.com.br,https://app.hexavante.com.br,https://painel.hexavante.com.br"
    ports:
      - "127.0.0.1:3050:3050"
    networks:
      - hexavante_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3050/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  hexavante_data:

networks:
  hexavante_net:
